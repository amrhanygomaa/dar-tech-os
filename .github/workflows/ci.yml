name: Sprint 01 quality gate

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://dartech:dartech@127.0.0.1:5432/dartech_os_test?schema=public
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: dartech_os_test
          POSTGRES_PASSWORD: dartech
          POSTGRES_USER: dartech
          PGTZ: UTC
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dartech -d dartech_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Run the repository quality gate
        run: npm run quality:gate
