name: dar-tech-os

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartech_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartech}
      POSTGRES_USER: ${POSTGRES_USER:-dartech}
      PGTZ: UTC
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://dartech:dartech@postgres:5432/dartech_os?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      API_PORT: 3001
      APP_ENV: development
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:-http://localhost:3000/onboarding/callback/local}
      AUTH_LOCAL_IDENTITIES_JSON: ${AUTH_LOCAL_IDENTITIES_JSON:-[]}
      AUTH_LOCAL_PROVIDER_ENABLED: ${AUTH_LOCAL_PROVIDER_ENABLED:-false}
      AUTH_TRANSACTION_TTL_SECONDS: ${AUTH_TRANSACTION_TTL_SECONDS:-300}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-86400}
      ONBOARDING_RATE_LIMIT_MAX_REQUESTS: ${ONBOARDING_RATE_LIMIT_MAX_REQUESTS:-30}
      ONBOARDING_RATE_LIMIT_WINDOW_SECONDS: ${ONBOARDING_RATE_LIMIT_WINDOW_SECONDS:-60}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://dartech:dartech@postgres:5432/dartech_os?schema=public}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      TZ: UTC
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      APP_ENV: development
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://dartech:dartech@postgres:5432/dartech_os?schema=public}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
      TZ: UTC
      WORKER_HEALTH_FILE: /tmp/dar-tech-worker-heartbeat
      WORKER_HEALTH_MAX_AGE_MS: 30000
      WORKER_HEARTBEAT_INTERVAL_MS: 10000
      WORKER_ID: ${WORKER_ID:-worker-local-1}
      WORKER_QUEUE: ${WORKER_QUEUE:-foundation}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-30000}
      WORKER_RETRY_BASE_DELAY_MS: ${WORKER_RETRY_BASE_DELAY_MS:-1000}
      WORKER_RETRY_MAX_DELAY_MS: ${WORKER_RETRY_MAX_DELAY_MS:-60000}
      WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "infra/docker/check-worker-health.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
